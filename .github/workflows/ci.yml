name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime + dev deps (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check --output-format=github src scripts ml
          ruff format --check src scripts ml tests
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx oxlint
      - name: Type check
        run: npm run typecheck
      - name: Build (Next.js static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners
        run: pip install bandit pip-audit semgrep

      # Static analysis of our own code — enforced (offline, deterministic).
      - name: Bandit (Python SAST)
        run: bandit -r backend/src backend/ml -c backend/bandit.yaml -q

      # Registry rulesets need network and can change; advisory so an upstream
      # rule update can't turn an unrelated PR red. Findings show as annotations.
      - name: Semgrep (OWASP + language rules)
        continue-on-error: true
        run: semgrep scan --config p/python --config p/javascript --config p/owasp-top-ten backend/src frontend/app frontend/src

      # Dependency CVEs — advisory (transitive CVEs with no fix shouldn't block a merge).
      - name: pip-audit (backend deps)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --desc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend deps)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
