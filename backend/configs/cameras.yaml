cameras:
  - id: "CAM_STREET"
    name: "Street Traffic Camera"
    source: "./data/demo/street_traffic.mp4"
    fps: 15  # capped from 30 — reduces decode pressure; GPU can't consume 30fps×7 cams
    resolution: [1920, 1080]
    capabilities:
      - "detection"
      - "tracking"
      - "face"
      - "anpr"
    enabled: false

  - id: "CAM_PEOPLE"
    name: "City Street Pedestrian Surveillance"
    source: "./data/demo/city_street_pedestrians.mp4"
    fps: 12
    resolution: [1280, 720]
    capabilities:
      - "detection"
      - "tracking"
      - "face"
    enabled: false

  - id: "CAM_HIGHWAY"
    name: "Highway Border Crossing"
    source: "./data/demo/highway_border.mp4"
    fps: 15  # capped from 30 — 1080p decode at 30fps starves inference queue
    resolution: [1920, 1080]
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"
    enabled: false

  - id: "CAM_CHECKPOINT"
    name: "Indoor Checkpoint"
    source: "./data/demo/indoor_checkpoint.mp4"
    fps: 15  # capped from 30 — static indoor scene doesn't need 30fps analysis
    resolution: [1920, 1080]
    capabilities:
      - "detection"
      - "tracking"
      - "face"
    enabled: false

  - id: "CAM_VIRAT_PARKING"
    name: "VIRAT Parking Lot"
    source: "./data/demo/virat_parking_lot.mp4"
    fps: 15  # capped from 24 — parking lot has slow-moving subjects
    resolution: [1280, 720]
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"
    enabled: false

  - id: "CAM_VIRAT_STREET"
    name: "Tram Crosswalk Pedestrians"
    source: "./data/demo/tram_crosswalk_pedestrians.mp4"
    fps: 12
    resolution: [1280, 720]
    capabilities:
      - "detection"
      - "tracking"
      - "face"
      - "anpr"
    enabled: false

  - id: "CAM_VIRAT_VEHICLE"
    name: "Overhead Highway Traffic"
    source: "./data/demo/overhead_highway_traffic.mp4"
    fps: 12
    resolution: [1280, 720]
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"
    enabled: false

  - id: "CAM_HIGHWAY_4K"
    name: "Highway Traffic Flow (Pixabay)"
    source: "./data/demo/traffic_flow_highway.mp4"
    fps: 30
    # Downscaled from the source's native 3840x2160 to 1080p on ingest
    # (VideoSource.read_frame's cv2.resize). The earlier crash came from
    # setting `resolution` to the SOURCE's own 4K size, which decoded and
    # re-encoded every frame at full 4K for nothing - the resize path
    # already existed, it was just configured to resize to the same size.
    resolution: [1920, 1080]
    enabled: false
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"

  - id: "CAM_CROSSWALK"
    name: "Pedestrian Crosswalk (Pixabay)"
    source: "./data/demo/crosswalk_crowd.mp4"
    fps: 30  # halved from the 60fps source - static scene, halves inference load
    resolution: [1920, 1080]  # downscaled on ingest - see CAM_HIGHWAY_4K
    enabled: false
    capabilities:
      - "detection"
      - "tracking"
      - "face"

  - id: "CAM_MILITARY_TEST"
    name: "Night CCTV Intersection"
    source: "./data/demo/night_cctv_intersection.mp4"
    fps: 12
    resolution: [1280, 720]
    enabled: false
    capabilities:
      - "detection"
      - "tracking"
      - "face"

  - id: "CAM_URBAN_OVERHEAD"
    name: "Urban Intersection Overhead"
    source: "./data/demo/urban_intersection_overhead.mp4"
    fps: 12
    resolution: [1280, 720]
    enabled: false
    capabilities:
      - "detection"
      - "tracking"
      - "face"
      - "anpr"

  - id: "CAM_HIGHWAY_JUNCTION"
    name: "Multilane Highway Junction"
    source: "./data/demo/multilane_highway_junction.mp4"
    fps: 12
    resolution: [1280, 720]
    enabled: false
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"

  - id: "CAM_ROADSIDE_CROSSING"
    name: "Roadside Pedestrian Crossing"
    source: "./data/demo/roadside_pedestrian_crossing.mp4"
    fps: 12
    resolution: [1280, 720]
    enabled: false
    capabilities:
      - "detection"
      - "tracking"
      - "face"

  - id: "CAM_SCOOTER_INTERSECTION"
    name: "Scooter Traffic Intersection"
    source: "./data/demo/scooter_traffic_intersection.mp4"
    fps: 12
    resolution: [1280, 720]
    enabled: false
    capabilities:
      - "detection"
      - "tracking"
      - "face"
      - "anpr"

  - id: "CAM_PLATE_DEMO"
    name: "Checkpoint ANPR Demo (synthetic Indian plates)"
    # Real intersection footage with rendered Indian plates painted over the
    # original ones: scripts/make_indian_plate_demo.py. Ground truth in the .json.
    source: "./data/demo/indian_plates_synthetic.mp4"
    fps: 15
    resolution: [1920, 1080]
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"
    enabled: false

  # --- Indian roads (4K, Pexels License: free to use) — see data/demo/SOURCES.md ---
  - id: "CAM_IN_MUMBAI"
    name: "Mumbai Arterial Road"
    source: "./data/demo/india_mumbai_traffic_4k.mp4"
    fps: 10  # 4K decode is heavy; 10 fps keeps four 4K cameras responsive
    resolution: [3840, 2160]
    location: "Mumbai, Maharashtra"
    capabilities: ["detection", "tracking", "face", "anpr"]
    enabled: true

  - id: "CAM_IN_BHOPAL"
    name: "Bhopal Signal Intersection"
    source: "./data/demo/india_bhopal_intersection_4k.mp4"
    fps: 10
    resolution: [3840, 2160]
    location: "Bhopal, Madhya Pradesh"
    capabilities: ["detection", "tracking", "face", "anpr"]
    enabled: true

  - id: "CAM_IN_KOLKATA"
    name: "Kolkata Bus Street"
    source: "./data/demo/india_kolkata_street_buses_4k.mp4"
    fps: 10
    resolution: [3840, 2160]
    location: "Kolkata, West Bengal"
    capabilities: ["detection", "tracking", "face", "anpr"]
    enabled: true

  - id: "CAM_IN_FLYOVER"
    name: "Flyover Signal (elevated view)"
    source: "./data/demo/india_flyover_signal_4k.mp4"
    fps: 10
    resolution: [3840, 2160]
    location: "India"
    capabilities: ["detection", "tracking", "anpr"]
    enabled: true
