cameras:
  - id: "CAM_STREET"
    name: "Street Traffic Camera"
    source: "./data/demo/street_traffic.mp4"
    fps: 30
    resolution: [1920, 1080]
    capabilities:
      - "detection"
      - "tracking"
      - "face"
      - "anpr"

  - id: "CAM_PEOPLE"
    name: "Pedestrian Surveillance"
    source: "./data/demo/people_walking.mp4"
    fps: 30
    resolution: [1920, 1080]
    capabilities:
      - "detection"
      - "tracking"
      - "face"

  - id: "CAM_HIGHWAY"
    name: "Highway Border Crossing"
    source: "./data/demo/highway_border.mp4"
    fps: 30
    resolution: [1920, 1080]
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"

  - id: "CAM_CHECKPOINT"
    name: "Indoor Checkpoint"
    source: "./data/demo/indoor_checkpoint.mp4"
    fps: 30
    resolution: [1920, 1080]
    capabilities:
      - "detection"
      - "tracking"
      - "face"

  - id: "CAM_VIRAT_PARKING"
    name: "VIRAT Parking Lot"
    source: "./data/demo/virat_parking_lot.mp4"
    fps: 24
    resolution: [1280, 720]
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"

  - id: "CAM_VIRAT_STREET"
    name: "VIRAT Street Activity"
    source: "./data/demo/virat_street_activity.mp4"
    fps: 30
    resolution: [1280, 720]
    capabilities:
      - "detection"
      - "tracking"
      - "face"
      - "anpr"

  - id: "CAM_VIRAT_VEHICLE"
    name: "VIRAT Vehicle Area"
    source: "./data/demo/virat_vehicle_area.mp4"
    fps: 30
    resolution: [1280, 720]
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"

  - id: "CAM_HIGHWAY_4K"
    name: "Highway Traffic Flow (Pixabay)"
    source: "./data/demo/traffic_flow_highway.mp4"
    fps: 30
    # Downscaled from the source's native 3840x2160 to 1080p on ingest
    # (VideoSource.read_frame's cv2.resize). The earlier crash came from
    # setting `resolution` to the SOURCE's own 4K size, which decoded and
    # re-encoded every frame at full 4K for nothing - the resize path
    # already existed, it was just configured to resize to the same size.
    resolution: [1920, 1080]
    enabled: true
    capabilities:
      - "detection"
      - "tracking"
      - "anpr"

  - id: "CAM_CROSSWALK"
    name: "Pedestrian Crosswalk (Pixabay)"
    source: "./data/demo/crosswalk_crowd.mp4"
    fps: 30  # halved from the 60fps source - static scene, halves inference load
    resolution: [1920, 1080]  # downscaled on ingest - see CAM_HIGHWAY_4K
    enabled: true
    capabilities:
      - "detection"
      - "tracking"
      - "face"

  - id: "CAM_MILITARY_TEST"
    name: "Stage-2 Smoke Test (synthetic, aircraft frame looped)"
    source: "./data/demo/military_test_aircraft.mp4"
    fps: 10
    resolution: [640, 640]
    enabled: true  # 640x640, negligible memory cost
    capabilities:
      - "detection"
      - "tracking"
