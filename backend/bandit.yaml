# Bandit config for IBVAP backend.
# Run: bandit -r src ml -c bandit.yaml

exclude_dirs:
  - venv
  - tests
  - scripts/legacy

skips:
  # B104: 0.0.0.0 bind is intentional (container listens on all interfaces;
  #       nginx is the only published entry point).
  - B104
  # B404/B603/B607: subprocess use in dataset-prep / training helpers, not in
  #       the request path; inputs are operator-supplied CLI args.
  - B404
  - B603
  - B607
  # B101: asserts are used in non-security control flow / tests only.
  - B101
  # B311: `random` in ml/verify_dataset.py just picks sample rows to print.
  - B311
