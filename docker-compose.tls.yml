# Overlay: TLS termination at nginx.
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up
services:
  backend:
    environment:
      - TRUSTED_PROXY=1
  frontend:
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    command: ["/bin/sh", "-c", "cp /etc/nginx/nginx-tls.template /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
