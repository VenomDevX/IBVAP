# =============================================================================
# IBVAP — Docker Compose (Development)
# Lightweight stack: Backend API + Frontend UI
# Database & Auth handled by Supabase CLI (npx supabase start)
# =============================================================================

services:
  # Python FastAPI Backend (AI Microservice)
  backend:
    build: ./backend
    container_name: ibvap_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./backend/configs:/app/configs
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - IBVAP_CONFIG_DIR=/app/configs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # React Frontend (Nginx)
  frontend:
    build: ./frontend
    container_name: ibvap_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
