# =============================================================================
# IBVAP — Docker Compose
# Backend API + Frontend UI. Auth via Supabase CLI (npx supabase start).
# Runtime datastore is PostgreSQL (migrated from SQLite for performance).
# For TLS, use:  docker compose -f docker-compose.yml -f docker-compose.tls.yml up
# =============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: ibvap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibvap
      POSTGRES_PASSWORD: ibvap_password
      POSTGRES_DB: ibvap
    volumes:
      - ibvap_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibvap"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ibvap_backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - IBVAP_ENV=production
      - IBVAP_CONFIG_DIR=/app/configs
      - DATABASE_URL=postgresql://ibvap:ibvap_password@db:5432/ibvap
    volumes:
      - ./outputs:/app/outputs
      - ./backend/configs:/app/configs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 4g
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${VITE_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in a .env next to docker-compose.yml}}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}}
    container_name: ibvap_frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  ibvap_db:
