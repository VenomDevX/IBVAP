version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ibvap_db
    restart: always
    environment:
      POSTGRES_USER: ibvap_user
      POSTGRES_PASSWORD: ibvap_password
      POSTGRES_DB: ibvap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibvap_user -d ibvap"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ibvap_app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DATABASE_URL=postgresql://ibvap_user:ibvap_password@db:5432/ibvap
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
