<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — IBVAP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1>IBVAP</h1>
                <p>Register New Account</p>
            </div>

            <form id="signup-form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" required
                           placeholder="Choose a username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="full_name">
                        <i class="fas fa-id-card"></i> Full Name
                    </label>
                    <input type="text" id="full_name" name="full_name" required
                           placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" required
                           placeholder="Choose a password" autocomplete="new-password">
                </div>

                <div class="form-error" id="signup-error" style="display:none"></div>
                <div class="form-success" id="signup-success" style="display:none; color: green; font-weight: 500; margin-bottom: 15px;"></div>

                <button type="submit" class="btn btn-primary btn-full" id="signup-btn">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </form>

            <div class="login-footer" style="margin-top: 15px;">
                <p>Already have an account? <a href="/login">Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            const error = document.getElementById('signup-error');
            const success = document.getElementById('signup-success');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            error.style.display = 'none';
            success.style.display = 'none';

            const payload = {
                username: document.getElementById('username').value,
                full_name: document.getElementById('full_name').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/auth/signup', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload) 
                });
                
                const data = await res.json();

                if (res.ok) {
                    success.textContent = 'Account created successfully! Redirecting to login...';
                    success.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    error.textContent = data.detail || 'Signup failed';
                    error.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up';
                }
            } catch (err) {
                error.textContent = 'Connection error';
                error.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up';
            }
        }
    </script>
</body>
</html>
