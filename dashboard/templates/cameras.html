{% extends "base.html" %}
{% block title %}Cameras{% endblock %}
{% block nav_cameras %}active{% endblock %}
{% block page_title %}Camera Management{% endblock %}

{% block content %}
<div class="camera-grid" id="camera-grid">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading cameras...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadCameras() {
    try {
        const res = await apiFetch('/api/cameras');
        const cameras = await res.json();
        const grid = document.getElementById('camera-grid');
        if (!cameras.length) {
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-video-slash"></i><p>No cameras configured</p></div>';
            return;
        }
        grid.innerHTML = cameras.map(c => `
            <div class="camera-card-item">
                <div class="camera-preview">
                    <img src="/api/stream/${c.camera_id}/snapshot" alt="${c.name}"
                         onerror="this.src=''; this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="camera-offline" style="display:none">
                        <i class="fas fa-video-slash"></i><p>Offline</p>
                    </div>
                </div>
                <div class="camera-info-bar">
                    <div>
                        <h4>${c.name}</h4>
                        <span class="camera-id">${c.camera_id}</span>
                    </div>
                    <div class="camera-meta">
                        <span class="status-dot ${c.status === 'online' ? 'online' : 'offline'}"></span>
                        <span>${c.status}</span>
                        ${c.fps ? `<span class="fps-badge">${c.fps} FPS</span>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
    } catch (err) {
        console.error('Failed to load cameras:', err);
    }
}

document.addEventListener('DOMContentLoaded', loadCameras);
setInterval(loadCameras, 10000);
</script>
{% endblock %}
