{% extends "base.html" %}
{% block title %}Event Detail{% endblock %}
{% block nav_events %}active{% endblock %}
{% block page_title %}Event Detail{% endblock %}

{% block content %}
<div class="event-detail" id="event-detail">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading event...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const eventId = '{{ event_id }}';

async function loadEventDetail() {
    try {
        const res = await apiFetch(`/api/events/${eventId}`);
        const e = await res.json();
        document.getElementById('event-detail').innerHTML = `
            <div class="detail-header">
                <div class="risk-indicator ${e.risk_level}">
                    <span class="risk-emoji">${getRiskEmoji(e.risk_level)}</span>
                    <span class="risk-text">${e.risk_level.toUpperCase()}</span>
                    <span class="risk-score">${e.risk_score?.toFixed(0) || 0}/100</span>
                </div>
                <h2>${formatEventType(e.event_type)}</h2>
                <p class="event-meta">
                    <span><i class="fas fa-video"></i> ${e.camera_id}</span>
                    <span><i class="fas fa-clock"></i> ${formatTime(e.timestamp)}</span>
                    <span><i class="fas fa-user"></i> ${e.object_type} (Track ${e.track_id})</span>
                </p>
            </div>
            
            ${e.temporal_context?.semantic_description ? `
            <div class="description-card" style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 20px;">
                <h3 style="margin-top: 0; color: var(--accent);"><i class="fas fa-align-left"></i> AI Description</h3>
                <p style="margin-bottom: 0; font-size: 1.1em; line-height: 1.5;">${e.temporal_context.semantic_description}</p>
            </div>
            ` : ''}

            <div class="detail-grid">
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-list"></i> Contributing Factors</h3></div>
                    <div class="card-body">
                        <ul class="factor-list">
                            ${(e.contributing_factors || []).map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}
                        </ul>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-map-pin"></i> Spatial Context</h3></div>
                    <div class="card-body">
                        <div class="context-info">
                            <p><strong>In Restricted Zone:</strong> ${e.spatial_context?.in_restricted ? 'Yes' : 'No'}</p>
                            <p><strong>Fence Crossed:</strong> ${e.spatial_context?.fence_crossed ? 'Yes' : 'No'}</p>
                            <p><strong>Zones:</strong> ${(e.spatial_context?.zones || []).join(', ') || 'None'}</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-clock"></i> Temporal Context</h3></div>
                    <div class="card-body">
                        <div class="context-info">
                            <p><strong>Night Time:</strong> ${e.temporal_context?.is_night ? 'Yes' : 'No'}</p>
                            <p><strong>Loitering:</strong> ${e.temporal_context?.is_loitering ? 'Yes' : 'No'}</p>
                            <p><strong>Duration:</strong> ${e.duration?.toFixed(1) || 0}s</p>
                        </div>
                    </div>
                </div>

                ${e.evidence_path ? `
                <div class="card evidence-card">
                    <div class="card-header"><h3><i class="fas fa-image"></i> Evidence</h3></div>
                    <div class="card-body">
                        <img src="/snapshots/${e.evidence_path.split('/').pop()}" alt="Evidence" class="evidence-img">
                    </div>
                </div>` : ''}
            </div>

            <div class="detail-actions">
                <a href="/events-page" class="btn"><i class="fas fa-arrow-left"></i> Back to Events</a>
            </div>
        `;
    } catch (err) {
        document.getElementById('event-detail').innerHTML = `
            <div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Event not found</p></div>
        `;
    }
}

document.addEventListener('DOMContentLoaded', loadEventDetail);
</script>
{% endblock %}
