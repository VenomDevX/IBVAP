{% extends "base.html" %}
{% block title %}Events{% endblock %}
{% block nav_events %}active{% endblock %}
{% block page_title %}Event History{% endblock %}

{% block content %}
<div class="filters-bar">
    <select id="filter-type" onchange="loadEvents()" class="select-small">
        <option value="">All Types</option>
        <option value="restricted_zone_entry">Zone Entry</option>
        <option value="fence_crossing">Fence Crossing</option>
        <option value="loitering">Loitering</option>
        <option value="night_movement">Night Movement</option>
        <option value="combined_suspicious_activity">Combined Suspicious</option>
    </select>
    <select id="filter-risk" onchange="loadEvents()" class="select-small">
        <option value="">All Risk Levels</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
    </select>
    <button onclick="loadEvents()" class="btn btn-sm"><i class="fas fa-refresh"></i> Refresh</button>
</div>

<div class="table-container" id="events-grid-wrapper">
    <!-- Grid.js will mount here -->
</div>
{% endblock %}

{% block scripts %}
<script>
let gridInstance = null;

async function loadEvents() {
    const type = document.getElementById('filter-type').value;
    const risk = document.getElementById('filter-risk').value;
    let url = '/api/events?limit=100';
    if (type) url += `&event_type=${type}`;
    if (risk) url += `&risk_level=${risk}`;

    try {
        const res = await apiFetch(url);
        const events = await res.json();
        
        const mappedData = events.map(e => [
            gridjs.html(`<span class="risk-badge ${e.risk_level}">${getRiskEmoji(e.risk_level)}</span>`),
            e.event_id,
            formatEventType(e.event_type),
            e.camera_id,
            e.object_type,
            formatTime(e.timestamp),
            e.risk_score?.toFixed(0) || 0,
            (e.contributing_factors || []).slice(0, 2).join(', '),
            gridjs.html(`<a href="/events/${e.event_id}" class="btn btn-xs">View</a>`)
        ]);

        if (gridInstance) {
            gridInstance.updateConfig({ data: mappedData }).forceRender();
        } else {
            gridInstance = new gridjs.Grid({
                columns: ["Risk", "Event ID", "Type", "Camera", "Object", "Time", "Score", "Factors", "Details"],
                data: mappedData,
                search: true,
                sort: true,
                pagination: { enabled: true, limit: 15 },
                className: { table: 'data-table' }
            }).render(document.getElementById('events-grid-wrapper'));
        }
    } catch (err) { console.error('Failed to load events:', err); }
}

document.addEventListener('DOMContentLoaded', loadEvents);
</script>
{% endblock %}
