# =============================================================================
# IBVAP — GPU override (NVIDIA). Requires the NVIDIA Container Toolkit on the host
# (Docker Desktop + WSL2 on Windows ships it).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Set detection.device / face.device to "cuda" in backend/configs/thresholds.yaml.
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_CUDA: "1"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
